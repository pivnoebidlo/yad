# What's in git
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: registry.local/web:1.4.0
          args: ["--port=8080", "--log=json"]
          env:
            - name: LOG_LEVEL
              value: info
            - name: DB_HOST
              value: postgres
          ports:
            - containerPort: 8080
        - name: sidecar
          image: envoyproxy/envoy:v1.31
