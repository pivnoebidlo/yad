name: Release

# Push a tag like v0.2.0 to build installers for all platforms and attach
# them to a draft GitHub release. Review the draft and publish it manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft release up front: parallel build jobs cannot see each other's
  # drafts and would otherwise each create their own.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          NAME: YAD ${{ github.ref_type == 'tag' && github.ref_name || format('(manual build {0})', github.run_number) }}
        run: |
          cat > notes.md <<'NOTES'
          ## Downloads
          - **macOS**: `.dmg` — `aarch64` for Apple Silicon, `x64` for Intel
          - **Linux**: `.AppImage`, `.deb` or `.rpm`
          - **Windows**: `.msi` or `-setup.exe`
          - **Command line** (any OS with Node.js 18+): `yad-cli.mjs` — `node yad-cli.mjs --help`

          > The macOS build is not notarized yet. After copying YAD to
          > Applications, run once:
          > `xattr -dr com.apple.quarantine /Applications/YAD.app`
          >
          > Installed YAD updates itself (it offers new releases on start), so
          > this is needed only for the first install. On Linux self-update
          > works for the `.AppImage`.
          NOTES
          id=$(gh api -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" -f target_commitish="${{ github.sha }}" -f name="$NAME" \
            -F draft=true -F body=@notes.md --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # The command-line tool is plain JavaScript: one file for every platform.
  cli:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build:cli
      - name: Attach yad-cli.mjs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST -H "Content-Type: application/javascript" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.id }}/assets?name=yad-cli.mjs" \
            --input dist-cli/yad-cli.mjs --jq .browser_download_url

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust-targets: ""
          - name: Windows
            os: windows-latest
            args: ""
            rust-targets: ""

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.args }}

      - run: npm ci
      - run: npm test

      # Updater packages (.app.tar.gz, .AppImage, setup .exe) are signed with this
      # key; tauri-action also uploads latest.json, which installed apps check.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          # Signed updater packages only here: local builds have no key.
          args: ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
