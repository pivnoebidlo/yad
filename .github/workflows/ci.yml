name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

      - name: Build and smoke-test the CLI
        run: |
          npm run build:cli
          node dist-cli/yad-cli.mjs --version
          node dist-cli/yad-cli.mjs diff src/lib/semantic/fixtures/manifest.yaml src/lib/semantic/fixtures/manifest.yaml

      - name: Test Rust backend
        working-directory: src-tauri
        run: cargo test --locked
